query RunInput {
  cart {
    buyerIdentity {
      customer {
        hasAnyTag(tags: ["distributor"])
      }
    }
    lines {
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          metafield(namespace: "custom", key: "distributor_price") {
            value
          }
        }
      }
    }
  }
}
