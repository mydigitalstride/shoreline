# Deploys the live theme ONLY when changes land on main.
# Requires a manual approval via GitHub environment protection rules
# (configure "main-theme" environment in repo Settings → Environments).
name: Deploy Live Theme

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    name: Push to live theme
    runs-on: ubuntu-latest
    environment: main-theme   # gates on required reviewers / wait timer
    steps:
      - uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Push to live theme
        run: |
          shopify theme push \
            --store="${{ secrets.SHOPIFY_STORE_URL }}" \
            --theme="${{ secrets.SHOPIFY_LIVE_THEME_ID }}" \
            --password="${{ secrets.SHOPIFY_THEME_ACCESS_PASSWORD }}" \
            --allow-live
